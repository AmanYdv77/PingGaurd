name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pingguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Type Check
        run: mypy app

      - name: Run Pytest with Coverage
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/pingguard_test
          REDIS_BROKER_URL: redis://localhost:6379/0
          REDIS_RESULT_BACKEND_URL: redis://localhost:6379/1
        run: pytest --cov=app --cov-report=term-missing -q

  docker:
    name: Docker Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare environment file from template
        run: |
          cp .env.example .env
          sed -i 's/change-me-generate-a-random-one/ci-throwaway-placeholder-secret-at-least-24-chars/g' .env

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Build Docker image
        run: docker build -t pingguard:ci .
