[tool.poetry]
name = "pingguard"
version = "0.1.0"
description = "Distributed Uptime Monitoring System — Chapter 1: The Request Layer"
authors = ["PingGuard Engineering Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic = "^2.9"
pydantic-settings = "^2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
