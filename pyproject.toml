[project]
name = "pingguard"
version = "1.0.0"
description = "Distributed Uptime Monitoring System"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Aman Yadav", email = "204555676+AmanYdv77@users.noreply.github.com" },
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring PostgreSQL or Redis services",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
