[tool.poetry]
name = "pingguard"
version = "0.4.0"
description = "Distributed Uptime Monitoring System — Chapter 4: Celery Beat (The Scheduling Heartbeat)"
authors = ["PingGuard Engineering Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic = "^2.9"
pydantic-settings = "^2.5"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
alembic = "^1.14.0"
python-dotenv = "^1.0.1"
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.0.0"
requests = "^2.32.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
